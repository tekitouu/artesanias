<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Artesanías MX</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth">

    <div class="auth-box">

        <div class="auth-art">

            <img
                src="images/logo.png"
                alt="Artesanías MX"
            >

            <h1>
                Bienvenida de nuevo.
            </h1>

            <p style="margin-top:15px">
                Entra para comprar, vender, guardar favoritos y hablar con artesanos.
            </p>

        </div>


        <div class="auth-form">

            <a class="back" href="index.html">
                ‹ Volver
            </a>

            <h2>
                Iniciar sesión
            </h2>

            <form action="perfil.html">

                <div class="form-group">

                    <label>
                        Correo electrónico
                    </label>

                    <input
                        class="form-control"
                        type="email"
                        placeholder="correo@ejemplo.com"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Contraseña
                    </label>

                    <input
                        class="form-control"
                        type="password"
                        placeholder="Contraseña"
                    >

                </div>


                <p style="text-align:right;margin:10px 0">

                    <a href="#">
                        ¿Olvidaste tu contraseña?
                    </a>

                </p>


                <button
                    class="btn btn-pink"
                    style="width:100%"
                    type="submit"
                >
                    Iniciar sesión
                </button>

            </form>


            <p style="margin-top:18px;text-align:center">

                ¿No tienes cuenta?

                <a
                    style="color:#8d1748;font-weight:bold"
                    href="registro.html"
                >
                    Crear cuenta
                </a>

            </p>

        </div>

    </div>

<script src="app.js"></script></body>
</html>
